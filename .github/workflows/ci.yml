name: Zentronyx DevSecOps CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite & Quality Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zentronyx_user
          POSTGRES_PASSWORD: zentronyx_test_password
          POSTGRES_DB: zentronyx_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://zentronyx_user:zentronyx_test_password@localhost:5432/zentronyx_db
          SYNC_DATABASE_URL: postgresql://zentronyx_user:zentronyx_test_password@localhost:5432/zentronyx_db
          JWT_SECRET: ci_pipeline_secret_key_32_bytes_long_string
          JWT_ALGORITHM: HS256
        run: |
          cd backend
          pytest -v --cov=app

  frontend-test:
    name: Frontend Vitest & TypeScript Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Verification
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Vitest Suite
        run: |
          cd frontend
          npm test

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build