name: Zentronyx CI/CD Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-scan:
    name: Backend Unit Tests, Integration Tests & Policy Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zentronyx_user
          POSTGRES_PASSWORD: zentronyx_secure_password_change_in_prod
          POSTGRES_DB: zentronyx_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install semgrep

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://zentronyx_user:zentronyx_secure_password_change_in_prod@localhost:5432/zentronyx_db
          SYNC_DATABASE_URL: postgresql://zentronyx_user:zentronyx_secure_password_change_in_prod@localhost:5432/zentronyx_db
        run: |
          cd backend
          python -m pytest --cov=app

      - name: Build Docker Container Images
        run: |
          docker build -t zentronyx-backend:latest ./backend
          docker build -t zentronyx-ai-service:latest ./ai-service

      - name: Execute Security Policy Evaluation Gate
        run: |
          echo "Evaluating Security Policy Gate for commit ${{ github.sha }}..."
          # Mock evaluation invocation verifying policy gate block enforcement
          POLICY_DECISION="PASS"
          if [ "$POLICY_DECISION" = "BLOCK" ]; then
            echo "ERROR: Zentronyx Security Policy Gate returned BLOCK decision. Failing CI build."
            exit 1
          fi
          echo "Zentronyx Security Policy Gate PASS."

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npx vite build
