databases:
  - name: zentronyx-db
    databaseName: zentronyx_db
    user: zentronyx_user
    plan: free

services:
  # ── Backend FastAPI Engine ─────────────────────────────────────────────────
  - type: web
    name: zentronyx-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: zentronyx-db
          property: connectionString
        # Render gives a postgres:// URL — convert to asyncpg
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: zentronyx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MAX_UPLOAD_SIZE
        value: "104857600"
      - key: WORKSPACE_ROOT
        value: /tmp/zentronyx_workspaces
      - key: SCAN_TIMEOUT
        value: "300"
      - key: AI_SERVICE_URL
        fromService:
          name: zentronyx-ai-service
          type: web
          property: host
          envVarKey: AI_SERVICE_URL
      - key: CORS_ORIGINS
        fromService:
          name: zentronyx-frontend
          type: web
          property: host
          envVarKey: FRONTEND_URL

  # ── AI / GNN Microservice ──────────────────────────────────────────────────
  - type: web
    name: zentronyx-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: zentronyx-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: zentronyx-backend
          type: web
          property: host
          envVarKey: BACKEND_URL
