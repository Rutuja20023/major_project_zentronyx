<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zentronyx | Security Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="zentronyx-logo">

            <!-- ========================= -->
            <!-- LOGO -->
            <!-- ========================= -->

            <div class="logo-container">

                <!-- Outer glow -->
                <div class="logo-glow"></div>

                <!-- Scanning ring -->
                <div class="scan-ring"></div>

                <svg
                    class="logo-svg"
                    viewBox="0 0 120 120"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- Outer rounded square -->

                    <rect
                        class="outer-frame"
                        x="8"
                        y="8"
                        width="104"
                        height="104"
                        rx="25"
                    />

                    <!-- Shield -->

                    <path
                        class="shield"
                        d="
                        M60 25
                        L87 36
                        V58
                        C87 77 76 91 60 99
                        C44 91 33 77 33 58
                        V36
                        Z
                        "
                    />

                    <!-- Z -->

                    <path
                        class="z-letter"
                        d="
                        M43 43
                        H78
                        L43 77
                        H78
                        "
                    />

                </svg>

                <!-- Moving scanner -->

                <div class="scan-line"></div>

            </div>


            <!-- ========================= -->
            <!-- BRAND -->
            <!-- ========================= -->

            <div class="brand">

                <div class="brand-name">

                    <span>Z</span>
                    <span>E</span>
                    <span>N</span>
                    <span>T</span>
                    <span>R</span>
                    <span>O</span>
                    <span>N</span>
                    <span>Y</span>
                    <span>X</span>

                </div>

                <div class="brand-line"></div>

                <div class="brand-subtitle">
                    SECURITY PLATFORM
                </div>

            </div>

        </div>


        <!-- Optional instruction -->

        <div class="instruction">
            CLICK THE LOGO TO REPLAY
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
