version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zentronyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentronyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentronyx_secure_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-zentronyx_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zentronyx_user} -d ${POSTGRES_DB:-zentronyx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zentronyx-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zentronyx-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zentronyx_user}:${POSTGRES_PASSWORD:-zentronyx_secure_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-zentronyx_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-zentronyx_user}:${POSTGRES_PASSWORD:-zentronyx_secure_password_change_in_prod}@postgres:5432/${POSTGRES_DB:-zentronyx_db}
      JWT_SECRET: ${JWT_SECRET:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-/tmp/zentronyx_workspaces}
      SCAN_TIMEOUT: ${SCAN_TIMEOUT:-300}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zentronyx-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: zentronyx-ai-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    networks:
      - zentronyx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zentronyx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - zentronyx-net

networks:
  zentronyx-net:
    driver: bridge

volumes:
  postgres_data:
